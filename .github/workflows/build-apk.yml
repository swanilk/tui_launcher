name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Setup Capacitor Android Project
        run: |
          # If android directory or gradlew does not exist, cleanly create native project
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Verify AndroidManifest.xml Integrity
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Verifying AndroidManifest.xml syntax..."
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$MANIFEST'); print('AndroidManifest.xml is valid XML')"
          fi

      - name: Verify Persistent Keystore
        run: |
          # Ensure persistent keystore exists for reproducible build signatures
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidTerminalLauncher-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
