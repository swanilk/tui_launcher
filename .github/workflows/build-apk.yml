name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Setup Capacitor Android Project
        run: |
          # If android directory or gradlew does not exist, cleanly create native project
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Patch AndroidManifest.xml for Default Home Launcher & Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting Android Home Launcher intent & system permissions..."
            
            # Add QUERY_ALL_PACKAGES and permissions before </manifest>
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.CALL_PHONE" />\n    <uses-permission android:name="android.permission.SEND_SMS" />\n    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
            
            # Add HOME and DEFAULT intent categories inside MainActivity intent-filter
            sed -i '/<category android:name="android.intent.category.LAUNCHER" \/>/a \                <category android:name="android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT" />' "$MANIFEST"
            
            # Set singleTask launchMode on MainActivity
            sed -i 's/<activity/<activity android:launchMode="singleTask"/' "$MANIFEST"
            
            echo "Patched AndroidManifest.xml successfully:"
            cat "$MANIFEST"
          fi

      - name: Patch Kotlin stdlib resolution
        run: |
          # Ensure no duplicate kotlin-stdlib classes between 1.8+ and legacy jdk7/jdk8
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' && 
                     (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useVersion '1.8.22'
                  }
              }
          }
          EOF

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidTerminalLauncher-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
